  <script>
  /* Auto-test connection badges when admin visits the settings page.
     Vanilla JS — intentionally outside Angular zone so it does not
     trigger extra change detection cycles. */
  (function () {
    'use strict';
    var SETTINGS_FRAG = 'app-settings';
    var _running = false;

    function isSettingsPage() {
      return window.location.hash.indexOf(SETTINGS_FRAG) !== -1;
    }

    function waitFor(selector, ms) {
      return new Promise(function (resolve, reject) {
        var el = document.querySelector(selector);
        if (el) { resolve(el); return; }
        var obs = new MutationObserver(function () {
          var found = document.querySelector(selector);
          if (found) { obs.disconnect(); resolve(found); }
        });
        obs.observe(document.body, { childList: true, subtree: true });
        setTimeout(function () { obs.disconnect(); reject(new Error('timeout ' + selector)); }, ms || 15000);
      });
    }

    async function runTests() {
      if (_running) return;
      _running = true;
      try {
        /* Wait for Angular to render the connections grid */
        await waitFor('.connections-grid');
        /* Extra settle time so Angular zone.js finishes initialising */
        await new Promise(function (r) { setTimeout(r, 1000); });

        /* Click the Test Connection button in each recognisable service card.
           Skip: bggpt (fake test), context (not a remote service). */
        var SKIP = { bggpt: true, context: true };
        document.querySelectorAll('.connection-card').forEach(function (card) {
          var icon = card.querySelector('.connection-icon');
          var btn  = card.querySelector('.btn-test');
          if (!icon || !btn) return;
          var service = Array.from(icon.classList).find(function (c) { return c !== 'connection-icon'; });
          if (service && !SKIP[service]) { btn.click(); }
        });

        /* Test the embedding endpoint — no button exists in the compiled UI */
        try {
          var res  = await fetch('/api/admin/settings/test/embedding', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}',
          });
          var data = await res.json();
          /* Find the Embedding Model card by heading text and update its badge */
          document.querySelectorAll('.connection-card').forEach(function (card) {
            var h4 = card.querySelector('h4');
            if (!h4 || !/embedding/i.test(h4.textContent || '')) return;
            var badge = card.querySelector('.connection-status');
            if (!badge) return;
            badge.classList.remove('disconnected', 'testing', 'connected');
            badge.classList.add(data.ok ? 'connected' : 'disconnected');
            badge.textContent = data.ok ? 'Connected' : 'Disconnected';
          });
        } catch (embErr) {
          console.warn('[health] embedding test failed:', embErr);
        }
      } catch (err) {
        console.warn('[health] auto-test error:', err);
      } finally {
        _running = false;
      }
    }

    function onNav() { if (isSettingsPage()) { runTests(); } }

    window.addEventListener('hashchange', onNav);
    if (document.readyState === 'complete') { onNav(); }
    else { window.addEventListener('load', onNav); }
  })();
  </script>
